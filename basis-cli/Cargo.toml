[package]
name = "basis-cli"
description = "The basis CLI, over the basis SDK and basis-acp: headless runs, an ACP server, and a websocket bridge. Installs as `basis`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "acp", "harness", "mentra"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
basis.workspace = true
basis-acp.workspace = true
basis-host.workspace = true
# The durable task layer (ADR-0019, D8): the CLI's lifecycle verbs are the
# first client of this, not its implementation.
basis-tasks.workspace = true

# The bridge speaks ACP's transport traits without speaking ACP itself: it
# relays frames between a websocket and the server basis-acp already serves.
agent-client-protocol.workspace = true
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
# Tests still use mentra's mock runtime and scripted providers directly.
mentra = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["time"] }
# The bridge tests dial the bridge, which the binary itself never does.
tokio-tungstenite = { workspace = true, features = ["connect"] }
# `basis-cli/tests/attach.rs` locks a task's `attach.lock` directly to test
# contention from outside the executor; `basis-tasks` is the crate that owns
# that file's format, not this one.
fs2.workspace = true

[[bin]]
name = "basis"
path = "src/main.rs"

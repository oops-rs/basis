[package]
name = "lan-core"
description = "The lan SDK: workspace discovery, run lifecycle, one event stream, and the two seams. No protocol, no transport, no TTY."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "harness", "mentra", "sdk"]
categories = ["development-tools"]

# MCP is one binding of the tool contract, not a privileged subsystem
# (ADR-0012), so an embedder can compile a lan-core that has never heard of it:
# no `.mcp.json` discovery, no `McpConfig` on a run, no servers registered.
# Default-on, because the binary and `lan-acp` both want it — a client's
# `mcpServers` on `session/new` is the protocol's own concept.
#
# What this cannot drop is the weight underneath: mentra's MCP client is
# unconditional upstream (its features are `openai-oauth` and `test-utils`), so
# there is nothing to forward. Gating lan's half still delivers the contract
# point — one seam, one adapter, droppable at compile time — and the day mentra
# grows a feature, this is where it gets forwarded.
[features]
default = ["mcp"]
mcp = []

[dependencies]
mentra.workspace = true

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
mentra = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["time"] }
tempfile.workspace = true

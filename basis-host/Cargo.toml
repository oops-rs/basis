[package]
name = "basis-host"
description = "Host-side basis machinery shared by protocol and terminal adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "harness", "mentra", "host"]
categories = ["development-tools"]

[dependencies]
# The host kit is the layer above the SDK and below any protocol or terminal
# surface.
basis = { workspace = true, features = ["mcp"] }

async-trait.workspace = true
serde = { workspace = true }
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
mentra = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }

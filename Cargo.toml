[workspace]
members = ["lan"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/oops-rs/lan"
homepage = "https://github.com/oops-rs/lan"

[workspace.dependencies]
mentra = "0.12"
mentra-provider = "0.4"

clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[workspace]
members = ["lan"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/oops-rs/lan"
homepage = "https://github.com/oops-rs/lan"

[workspace.dependencies]
# Path until 0.13 is published: lan needs the branching, layered skills,
# and compaction work (oops-rs/mentra#6–#9). The version keeps the manifest
# publishable — cargo prefers the registry once 0.13 is there.
mentra = { version = "0.13", path = "../mentra/mentra" }
mentra-provider = "0.4"

clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[workspace]
members = ["lan"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/oops-rs/lan"
homepage = "https://github.com/oops-rs/lan"

[workspace.dependencies]
# TEMPORARY: path dependency while the P2 session work lands in mentra.
# Switch back to the published version before P2 is done — the repo must not
# be left unpublishable. See docs/HANDOFF.md.
mentra = { version = "0.13", path = "../mentra/mentra" }
mentra-provider = { version = "0.4", path = "../mentra/mentra-provider" }

async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

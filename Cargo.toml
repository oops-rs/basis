[workspace]
members = ["basis", "basis-acp", "basis-cli", "basis-host", "basis-tasks"]
resolver = "3"

[workspace.package]
# One version across the five: they are one product split by dependency
# weight (ADR-0011), not five things that release on their own schedules.
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/oops-rs/basis"
homepage = "https://github.com/oops-rs/basis"

[workspace.dependencies]
# The layers of ADR-0011, named here so each crate states which of them it is
# built on and cargo resolves one version of each.
basis = { version = "0.11", path = "basis" }
basis-acp = { version = "0.11", path = "basis-acp" }
basis-host = { version = "0.11", path = "basis-host" }
# The durable task layer (ADR-0017 over ADR-0019's substrate, D8): one crate
# so the rules live once and are reachable from Rust, not only from the CLI
# that is now merely their first client.
basis-tasks = { version = "0.11", path = "basis-tasks" }

# The 0.26 floor's reasons are two host-observable runtime contract changes
# basis's code does not compile against unmodified in either direction, so the
# floor is hard both ways. First, `SessionOptions` gained `policy` and
# `tool_audience`: basis's exhaustive struct literal in `Runtime::mint`
# (`basis/src/runtime/scope.rs`) must initialize both, and states both — the
# workspace's own policy, and the tool audience its sessions resolve in.
# `Runtime::resume_minted` restates them, because mentra deliberately keeps
# neither in the persisted agent: a resumed session handed no policy would
# inherit the runtime's, which on a shared runtime is the posture of no
# workspace at all, and one handed no audience would resolve only global
# names.
# Second, `Session` now binds its runtime's live permission store
# automatically — the session namespace is the stable persisted agent id, not
# the ephemeral UI `SessionId`, so session rules survive a real resume — and
# manual `Session::set_permission_store`, `load_persisted_rules`, and cached
# `rule_store` access were removed because each could hold a stale
# authorization overlay against that live binding; basis's event forwarder
# and rule seeding now go through `SessionPermissionHandle` instead, whose
# `resolve_permission` is fallible (a store failure restores the pending
# request, and basis fails it closed). `Session::remembered_rules`
# now returns `Result<Vec<_>, RuntimeError>` because every call reads the live
# backend, and a session's current `ToolAuthorizer` is now sampled once per
# call and is authoritative over remembered rules: only its `Prompt` answer
# may be resolved by a matching rule or forwarded to the live permission flow,
# so a remembered allow can no longer bypass a session switched to a stricter
# authorizer, nor can a remembered denial override a current explicit allow.
# basis keeps its own two-rule approval layer on top and records the deltas
# where they are observable: for-this-session answers are cleared at the next
# attach (`Runtime::resume_minted`), and a forgotten conversation's rules are
# cleared beside its deletion (`store::forget_in`).
#
# One more 0.26 surface is depended on outright: compaction usage. The
# standard compaction engine now carries every provider-reported token-usage
# sample forward (`CompactionResponse::usage`,
# `CompactionOutcome::provider_usage`) instead of dropping it while
# extracting summary text, emits one ordinary `UsageReport` per sample after
# its existing `ContextCompacted` event, and charges an in-run pass to the
# run's shared token counter at the same point. basis's documented accounting
# is built on exactly that behavior — `RunUsage`/`RunReport` totals, token
# budgets and `BudgetPool` draw-down, and the per-sample `usage` lines on the
# stream, pinned by `basis/tests/compact.rs` — so an older runtime would
# silently break the accounting contract with nothing here to notice (#44).
#
# The adoption waves have landed, and these are the surfaces they took up.
# `SessionOptions::policy` and `SessionResumeOptions::policy` let one shared
# runtime give a live session a complete `RuntimePolicy` of its own instead of
# only the runtime builder's, which is what makes a `ShellAccess::Denied`
# workspace's posture hold for its own sessions and for nobody else's (#39).
# `Runtime::try_register_tool_for_audience` and `ToolAudience` let that runtime
# expose different tools to different live audiences, resolved exact-agent,
# then audience, then global — the primitive under both a repository's
# declared tools and a host's per-workspace native ones, and the reason a
# workspace's tools reach that workspace's runs and nothing else on the
# runtime (#47). `ExecutionHookParticipant` gives pre- and post-execution one
# ordered, named, object-safe participant chain in place of two legacy lists,
# so a workspace registers its whole `.basis/hooks.json` as one atomic mixed
# batch (#49), and `register_execution_hook_for_audience` is what puts that
# batch on a live runtime after construction, returning a guard the workspace
# drops (#40). `Session::with_tool_authorizer` replaces the runtime's default
# `ToolAuthorizer` for one live session without touching its siblings, which
# is how a read-only session refuses at the authorizer rather than only at the
# policy (#43/#38). `skill_root_key` is the canonical-path-with-fallback
# identity basis's skills ledger used to re-derive by hand, and now shares
# with upstream rather than drifting from it (#36). `Session::config` reads a
# resumed session's persisted `AgentConfig` back, which is how a resume checks
# that the conversation it picked up belongs to the workspace picking it up
# (#41). And `FileToolProfile::None` closes the caveat `ToolProfile::only`'s
# own docs name: a roster offering no file tool used to find one on the
# registry anyway, because no profile could unregister them (#42).
#
# One 0.26 surface is deliberately not taken up.
# `Runtime::fresh_provider_session_scope` mints an independent provider
# session scope without network I/O (#46) — but it is a cold mint, and the
# rebuild half of reuse that would have consumed it was retired by ADR-0026
# before this floor landed. Gate 1b stays retired; a pooling host opens a
# fresh workspace per checkout. The surface is named here so a later reader
# knows it was considered rather than missed.
#
# One 0.26 change is depended on for what it *removed*, which is the kind of
# floor reason that is easiest to lose. mentra 0.25 deep-copied the tool
# registry into every derived runtime handle, so a session's view of the
# registry was a snapshot taken at its creation and nothing registered
# afterwards could reach it; 0.26 shares one live registry instead. basis
# wants the live registry — the audience ladder is built on it — but the
# snapshot had been providing an isolation nobody had written down, and
# adopting the share is what made a same-directory sibling's tools reachable
# for the first time. `docs/proposals/0004` carries the account and the fix:
# an agent's ledger row now lives for its run, and `PreparedRun::into_session`
# is withdrawn.
#
# The 0.25 floor's reasons still hold beneath it. The primary provider stream
# observes the run's cancellation token and deadline while the provider
# request is opening *and* while the runtime waits for the first model event,
# so a provider that accepts a request and then stalls cannot leave a host
# waiting forever; retry backoff observes those same hard bounds. And
# `McpStdioClient::connect` starts a server with `env_clear`, restores
# Mentra's documented runnable baseline, and layers only the explicitly named
# `McpServerConfig::env` entries over it, with a host process group/tree
# lifecycle basis depends on rather than copying a second MCP launcher.
#
# The 0.24 floor's reasons still hold beneath it. Three of its surfaces basis
# depends on today. `CompactionBounds` and `Session::compact_with_bounds` are
# what let basis's on-demand pass be taken back; `AutoCompactTrigger` is what
# lets its two threshold knobs say "a share of a known window and nothing else"
# — a posture that had no spelling while a cleared token count was also the off
# switch; and the fixed gate order that runs every pre-execution hook *before*
# the tool authorizer is what makes the thing a person approves the narrowed
# command a hook left rather than the one the model wrote. basis writes no line
# of code for that last one, which is exactly why the floor has to carry it: on
# an older runtime it would be lost with nothing here to notice.
#
# The other 0.24 floor reasons are adopted now, too. `BoundedCommand` is the
# spawn discipline basis's subprocess hooks and declared tools use as one
# primitive rather than a hand-rolled copy that loses `env_clear` or the group
# kill a field at a time; `unregister_skills_dir(s)` lets a workspace that
# closes on a runtime other workspaces are still running on take its skills
# back instead of leaving them reachable without it; and
# `validate_mcp_server_name` refuses a server name that would collide in a
# bridged tool name before it is connected rather than after. They remain hard
# floor reasons: lowering the floor would make basis recreate these runtime
# contracts locally, against ADR-0005's seam discipline.
# The 0.23.4 floor's reasons still hold beneath it: it
# reserves generated terminal output before execution and validates a
# candidate before that tool may terminate, which is the contract behind
# Basis's report-preserving validated multipart output. The 0.23.3 floor's
# reasons still hold beneath that:
# its Session exposes the serialized, quiescent synchronous agent-event tap Basis forwards,
# mentra-provider can mint fresh Responses session scopes for safe rebuilds,
# and dropping a minted runtime releases its background observer state. The
# 0.22 floor's reasons still hold beneath it: basis's exhaustive event
# normalizer owns the
# `RequestToolResultsElided` wire event, while its compaction adapter
# deliberately leaves the mutually exclusive projected-byte budget disabled.
# The 0.21 floor's reasons still hold beneath it — `FileRuntimeStore`, which
# is what `with_store_dir` opens now that basis links no database (ADR-0023,
# D1), and the `DisposableSubagentTemplate` / `spawn_subagent_from` family,
# which is how a child policy overrides a subagent's roster, model or system
# prompt (D4). The 0.20 floor's reasons still hold beneath those —
# `PermissionRequested.classification`, the
# `Box`/`Arc` implementations of the tool traits,
# `McpManager::connect_streamable_http` — as do the 0.19 floor's (the
# chat/completions wire `with_wire` defaults a base URL to and the keyless
# door behind it, `post_tool_use`, window-relative compaction and
# `Session::context_window`, `Session::compact`/`set_name` and the
# per-session persist identifier, `try_register_tool`/`unregister_tool`, and
# the delegation relay) and the older floors' (ADR-0021's command targets and
# pattern-as-data at 0.18.2, the provider-retry and Responses-transport knobs
# at 0.18.3).
#
# `default-features = false` drops exactly two things. mentra's Responses
# websocket transport: `basis` re-offers it as a `responses-websocket`
# feature for an embedder who wants it (see its manifest), which is also the
# feature `with_responses_transport` needs before it can select that wire;
# the binary and `basis-acp` do not, because neither has a surface that would
# ask for it. And mentra's `store-sqlite` feature: with it off the default
# persistent store is the file-backed one, which is exactly ADR-0023's
# posture — basis persists to files and links no database — so nothing
# re-offers it.
mentra = { version = "0.26.0", default-features = false }

async-trait = "0.1"
# ACP carries an image in a prompt as base64; basis's `PromptPart` carries the
# bytes, because that is what mentra hands a provider. `basis-acp` is the one
# place the two meet, so it is the only crate here that names this. Already in
# the tree via mentra-provider, which does the encoding on the way back out.
base64 = "0.22"
# Moves a blocking reader onto its own thread, which is how stdin becomes an
# async stream. Already in the tree via agent-client-protocol, whose own stdio
# transport is built on it; `basis-acp` names it because it builds that transport
# itself, to inspect the first line before serving (ADR-0015).
blocking = "1"
clap = { version = "4.6", features = ["derive"] }
# `std::fs::canonicalize` on Windows returns the verbatim form (`\\?\C:\repo`),
# and basis resolves the workspace root exactly once and then hands that one
# value to mentra as a policy root and an agent base directory. mentra compares
# a candidate against a root with `starts_with` over components it normalizes
# without simplifying the prefix, so a verbatim root never prefixes the plain
# absolute path a model supplies and every such path would be denied. `dunce`
# is the crate for exactly this question and answers it more carefully than a
# hand-rolled strip would: it leaves the verbatim form alone when a plain one
# would name something else or nothing at all — a reserved DOS name, a segment
# ending in a dot or space, a path past `MAX_PATH`. Zero dependencies, and a
# `const fn` no-op off Windows, so it costs the other two platforms nothing.
dunce = "1"
# `Sink`/`Stream` adapters for the two transports basis builds itself: `basis-acp`'s
# peekable stdio one and the binary's websocket bridge. Already in the tree via
# agent-client-protocol, whose own transports are defined in terms of these traits.
futures = "0.3"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same YAML implementation mentra parses skill frontmatter with, so a
# template's frontmatter and a skill's are read by one dialect rather than two.
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# Stable, capability-scoped identifiers for local task services. ACP already
# brings uuid into the lockfile, but basis names it directly because transitive
# dependencies are not an API contract.
uuid = { version = "1", features = ["v4", "serde"] }

# Server side only: the bridge accepts websocket connections, it never dials
# one. Already in the tree via mentra-provider, so this names what basis itself
# needs rather than adding a dependency.
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "handshake",
] }

# Pinned exactly: 0.10 -> 0.11 removed the `Agent` trait entirely and 1.x -> 2.0
# was a second breaking overhaul, so a caret range here would silently change
# the shape of the whole server. Re-check deliberately on upgrade (ADR-0002).
agent-client-protocol = "=2.0.0"

# A release binary that is mostly debug symbols and duplicated codegen is
# nobody's intent; it is just cargo's default. These four settings take basis
# from 24MB to 8.9MB with no behavioral change.
#
# Deliberately absent, and worth saying why so nobody adds it for the 1.3MB:
# `panic = "abort"`. The ACP server outlives a failed turn, and a host embedding
# the crate outlives a failed run — aborting converts any panic, including one
# inside a dependency, into killing the whole process. That is exactly the
# property those surfaces exist to provide.
[profile.release]
# ~5MB of the original 24MB was symbols nobody reads in a shipped binary.
strip = true
# "s" rather than 3 (12MB) or "z" (6.9MB): basis spends its life waiting on a
# model, so a little code-layout speed is a cheap trade, while "z" starts
# costing throughput in the JSON and streaming paths that do run hot.
opt-level = "s"
lto = true
codegen-units = 1

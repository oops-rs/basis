[package]
name = "basis-tasks"
description = "The durable task layer over basis: a filesystem-coordinated lifecycle for spawned agents, reachable from Rust and not only from the CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "harness", "mentra", "durable"]
categories = ["development-tools"]

[dependencies]
# basis alone (ADR-0022 decision 4). Resume recovery reads a resumed session's
# own committed messages — the last assistant text, for the crashed process's
# unrecorded result — through `PreparedRun::last_assistant_text`, the fact
# basis exposes beside `answered_turns` so this crate never has to match on
# `mentra::Role`, and so never has to name mentra to do it.
basis.workspace = true
basis-host.workspace = true

# The attach lock: one writer, ever, per task (ADR-0019). Already in the tree
# via basis-cli, which is where this crate's implementation lived before
# extraction.
fs2.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# Atomic-replace writes for every durable file: a temporary file in the same
# directory, persisted over the destination.
tempfile.workspace = true
tokio.workspace = true
# Stable, capability-scoped task ids: the `<workspace-key>/<uuid>` grammar.
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
# Tests only, and the runtime code above still names basis alone. Two things
# have no basis spelling and cannot get one without basis re-exporting mentra's
# whole permission vocabulary for a test's sake: a scripted runtime
# (`mentra::test`), and the `RememberedRule` a test seeds to prove
# `Approve::Never` outranks it. Every other crate in this workspace already
# takes mentra's test utilities the same way.
mentra = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["time"] }

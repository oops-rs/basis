[package]
name = "lan"
version = "0.1.0"
description = "A full-functional, embeddable agent harness built on Mentra. Library first, binary second."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "acp", "harness", "mentra"]
categories = ["development-tools"]

[dependencies]
mentra.workspace = true
mentra-provider.workspace = true

agent-client-protocol.workspace = true
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
mentra = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["time"] }
tempfile.workspace = true

[[bin]]
name = "lan"
path = "src/main.rs"

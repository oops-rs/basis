name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A push that lands while an older run is still going makes that run
# irrelevant, so stop it rather than paying for an answer about stale code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Costs nothing until something fails, and when something fails in CI the
  # backtrace is usually the whole diagnosis.
  RUST_BACKTRACE: 1

jobs:
  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Check the workspace against the MSRV
        run: cargo check --workspace --all-targets --all-features

  ci:
    name: Format, lint, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Three platforms because lan spawns processes, reads a workspace, and
        # binds a loopback socket — the places where "works on my machine" is
        # least trustworthy.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Cheapest first: formatting fails in seconds and unambiguously, so there
      # is no reason to compile before finding out.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Hook and bridge tests spawn processes and bind loopback sockets. They
      # need no network and no credentials — nothing here reaches a provider.
      - name: Run tests
        run: cargo test --workspace --all-features
